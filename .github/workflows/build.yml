#
# Rilis otomatis Serambi.
# Setiap push ke branch main: kalau versi di package.json belum punya Release,
# workflow ini membangun installer Windows dan Mac lalu menerbitkan Release vX.Y.Z.
# Aplikasi yang sudah terpasang mengambil pembaruan dari Release terbaru.
#
# Versi lama di daftar RIWAYAT juga diterbitkan (sekali saja) supaya semua versi
# Serambi tetap bisa dilihat dan diunduh di halaman Releases.
#
# Cara merilis versi baru: naikkan "version" di package.json, lalu push ke main.

name: Rilis Serambi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rilis-serambi
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      todo: ${{ steps.plan.outputs.todo }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          # Riwayat versi: versi, commit, dan apakah ditandai sebagai versi terbaru.
          RIWAYAT: '[{"version":"1.0.0","sha":"d986125b2706196c39b5fe4f5e30599a8eacec47","latest":false}]'
        run: |
          current=$(node -p "require('./package.json').version")
          list=$(jq -c --arg v "$current" --arg s "$GITHUB_SHA" \
            '[.[] | select(.version != $v)] + [{version:$v, sha:$s, latest:true}]' <<< "$RIWAYAT")
          todo='[]'
          for row in $(jq -c '.[]' <<< "$list"); do
            v=$(jq -r .version <<< "$row")
            latest=$(jq -r .latest <<< "$row")
            assets=$(gh release view "v$v" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null || echo none)
            if [ "$assets" != "none" ] && [ "$assets" != "0" ]; then
              echo "v$v sudah punya Release lengkap, dilewati."
            elif [ "$latest" != "true" ] && ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$v" > /dev/null 2>&1; then
              # GitHub tidak mengizinkan workflow membuat tag di commit lama.
              echo "::notice title=Tag v$v belum ada::Terbitkan Release v$v lewat halaman Releases (target: commit Serambi $v). Installer akan dilampirkan otomatis."
            else
              echo "v$v akan dibangun dan diterbitkan."
              todo=$(jq -c --argjson r "$row" '. + [$r]' <<< "$todo")
            fi
          done
          echo "todo=$todo" >> "$GITHUB_OUTPUT"
          [ "$todo" != "[]" ] && echo "any=true" >> "$GITHUB_OUTPUT" || echo "any=false" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        rel: ${{ fromJSON(needs.plan.outputs.todo) }}
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.rel.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bangun installer
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            npx electron-builder --win --x64 --publish never
          else
            npx electron-builder --mac --x64 --arm64 --publish never
          fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: v${{ matrix.rel.version }}-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    needs: [plan, build]
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        rel: ${{ fromJSON(needs.plan.outputs.todo) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v${{ matrix.rel.version }}-*
          path: out
          merge-multiple: true
      - name: Siapkan catatan rilis
        run: |
          f=".github/release-notes/v${{ matrix.rel.version }}.md"
          if [ -f "$f" ]; then cp "$f" notes.md; else echo "Serambi ${{ matrix.rel.version }}" > notes.md; fi
      - name: Cek Release yang sudah ada
        id: ada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ matrix.rel.version }}" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "ada=true" >> "$GITHUB_OUTPUT"
          else
            echo "ada=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Buat tag v${{ matrix.rel.version }}
        if: steps.ada.outputs.ada != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ matrix.rel.version }}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "Tag $tag sudah ada."
            exit 0
          fi
          if ! out=$(gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="${{ matrix.rel.sha }}" 2>&1); then
            echo "::error title=Tag $tag gagal dibuat::$out"
            exit 1
          fi
          echo "Tag $tag dibuat."
      - name: Lampirkan installer ke Release yang sudah ada
        if: steps.ada.outputs.ada == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ matrix.rel.version }}" out/* --clobber -R "$GITHUB_REPOSITORY"
          body=$(gh release view "v${{ matrix.rel.version }}" -R "$GITHUB_REPOSITORY" --json body --jq .body)
          if [ -z "$body" ]; then
            gh release edit "v${{ matrix.rel.version }}" --notes-file notes.md -R "$GITHUB_REPOSITORY" \
              || echo "::warning::Catatan rilis tidak bisa diisi otomatis. Isi lewat halaman Releases."
          fi
      - if: steps.ada.outputs.ada != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ matrix.rel.version }}
          target_commitish: ${{ matrix.rel.sha }}
          name: Serambi ${{ matrix.rel.version }}
          body_path: notes.md
          files: out/*
          make_latest: ${{ matrix.rel.latest }}
          fail_on_unmatched_files: true
